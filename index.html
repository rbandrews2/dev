  <script>
  window.__wzosInstallPrompt = null;
  window.addEventListener('beforeinstallprompt', (event) => {
    event.preventDefault();
    window.__wzosInstallPrompt = event;
    window.dispatchEvent(new CustomEvent('wzos-beforeinstallprompt', { detail: event }));
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/service-worker.js').then((registration) => {
        registration.addEventListener('updatefound', () => {
          const worker = registration.installing;
          if (!worker) return;
          worker.addEventListener('statechange', () => {
            if (worker.state === 'installed' && navigator.serviceWorker.controller) {
              window.dispatchEvent(new CustomEvent('wzos-sw-update', { detail: registration }));
            }
          });
        });
      }).catch(err => {
        console.error('SW registration failed', err);
      });
    });
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!window.__wzosRefreshing) {
        window.__wzosRefreshing = true;
        window.location.reload();
      }
    });
  }
</script>
