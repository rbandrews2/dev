name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check activation key is configured
        run: npm run check:license
        env:
          VITE_ACTIVATION_PUBLIC_KEY: ${{ secrets.VITE_ACTIVATION_PUBLIC_KEY }}

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
